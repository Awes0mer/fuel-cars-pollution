# Review settings for the full-project CodeRabbit pass.
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    base_branches: [".*"]
  path_filters:
    - "!data/raw/**"
    - "!data/processed/**"
    - "!site/**"
    - "!results/**"
    - "!**/*.mp4"
    - "!**/*.png"
